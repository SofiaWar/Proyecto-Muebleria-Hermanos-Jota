<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Comunícate con Mueblería Hermanos Jota. Envíanos tu consulta sobre muebles a medida y presupuestos."
    />
    <title>Mueblería Hermanos Jota | Contacto</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a class="logo" href="index.html#inicio">Mueblería Hermanos Jota</a>
        <nav aria-label="Navegación principal">
          <ul>
            <li><a href="index.html#inicio">Inicio</a></li>
            <li><a href="index.html#nosotros">Nosotros</a></li>
            <li><a href="index.html#productos">Productos</a></li>
            <li><a href="contacto.html">Contacto</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="contacto-main">
      <section class="contacto-seccion" aria-labelledby="titulo-contacto">
        <h1 id="titulo-contacto">Hablemos de tu próximo compra</h1>
        <p class="seccion-intro">
          Escríbenos para consultar presupuestos, muebles a medida o conocer más
          sobre nuestro taller.
        </p>

        <form class="formulario-contacto" action="#" method="POST">
          <div class="campo">
            <label for="nombre">Nombre y apellido</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Ej. Ana Gómez"
              required
            />
          </div>

          <div class="campo">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="nombre@ejemplo.com"
              required
            />
          </div>

          <div class="campo">
            <label for="telefono">Teléfono (opcional)</label>
            <input
              type="tel"
              id="telefono"
              name="telefono"
              placeholder="Ej. +54 11 1234-5678"
            />
          </div>

          <div class="campo">
            <label for="motivo">Motivo de consulta</label>
            <select id="motivo" name="motivo" required>
              <option value="" disabled selected>Selecciona una opción</option>
              <option value="presupuesto">Presupuesto para mueble a medida</option>
              <option value="catalogo">Consulta sobre catálogo de productos</option>
              <option value="restauracion">Restauración y mantenimiento</option>
              <option value="otro">Otro</option>
            </select>
          </div>

          <div class="campo">
            <label for="mensaje">Mensaje</label>
            <textarea
              id="mensaje"
              name="mensaje"
              rows="5"
              placeholder="Cuéntanos medidas estimadas, madera deseada o detalles de tu consulta..."
              required
            ></textarea>
          </div>

          <button type="submit" class="btn-enviar">Enviar consulta</button>
        </form>
      </section>
    </main>

    <footer>
      <p>
        <small>
          © 2026 Mueblería Hermanos Jota · Taller familiar desde 1996 ·
          Buenos Aires
        </small>
      </p>
    </footer>
  </body>
</html>
